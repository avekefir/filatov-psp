<!DOCTYPE html>
<html>

<head>
  <title>Калькулятор</title>
  <link rel="stylesheet" href="software.css">
  <script type="text/javascript" src="software.js"></script>
</head>

<body>
  <div class="background"> 
    <div id="result" class="result">
      0
    </div>

    <div>
      <div>  
        <button id="btn_op_clear" class="my-btn secondary software">C</button>    
        <button id="btn_op_sign" class="my-btn secondary software">+/-</button>
        <button id="btn_op_percent" class="my-btn secondary software">%</button>
        <button id="btn_op_div" class="my-btn primary software">/</button>
        <button id="btn_op_backspace" class="my-btn secondary software">Del</button>
    </div>

      <div>
        <button id="btn_digit_7" class="my-btn software">7</button>
        <button id="btn_digit_8" class="my-btn software">8</button>
        <button id="btn_digit_9" class="my-btn software">9</button>
        <button id="btn_op_mult" class="my-btn primary software">x</button>
        <button id="btn_op_sqrt" class="my-btn secondary software">√</button>
        <button id="btn_op_reverse" class="my-btn primary software">1/x</button>
      </div>

      <div>
        <button id="btn_digit_4" class="my-btn software">4</button>
        <button id="btn_digit_5" class="my-btn software">5</button>
        <button id="btn_digit_6" class="my-btn software">6</button>
        <button id="btn_op_minus" class="my-btn primary software">-</button>
        <button id="btn_op_square" class="my-btn secondary software">x²</button>        
      </div>

      <div>
        <button id="btn_digit_1" class="my-btn software">1</button>
        <button id="btn_digit_2" class="my-btn software">2</button>
        <button id="btn_digit_3" class="my-btn software">3</button>
        <button id="btn_op_plus" class="my-btn primary software">+</button>
        <button id="btn_op_fact" class="my-btn secondary software">x!</button>        
      </div>

      <div>
        <button id="btn_digit_0" class="my-btn software">0</button>
        <button id="btn_digit_000" class="my-btn software">000</button>
        <button id="btn_digit_dot" class="my-btn software">.</button>
        <button id="btn_op_equal" class="my-btn primary execute software">=</button>
      </div>
    </div>
    <div>
      <button id="btn-switch" class="my-btn primary execute software">theme</button>
      <button id="btn_op_poisson" class="my-btn primary execute software">poisson</button>
    </div>
  </div>
</body>
</html>
